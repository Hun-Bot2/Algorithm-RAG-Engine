<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <title>알고리즘 학습</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span>알고리즘 학습</span></div>
      <p id="learner-label" class="learner-label">내 학습 기록</p>
    </header>
    <nav class="primary-nav" aria-label="주요 메뉴">
      <button type="button" data-view="journal" aria-current="page">학습 일지</button>
      <button type="button" data-view="today" aria-current="false">오늘</button>
      <button type="button" data-view="progress">학습 기록</button>
      <button type="button" data-view="contests">대회</button>
    </nav>
    <main id="main" class="page-shell" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="app" aria-busy="true"><p class="loading">학습 정보를 불러오는 중이에요.</p></div>
    </main>
    <footer><p>기록한 학습 정보는 본인 계정에서만 확인할 수 있어요.</p></footer>
  </body>
</html>
